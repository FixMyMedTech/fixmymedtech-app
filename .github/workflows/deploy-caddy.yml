name: Deploy Caddy

on:
  push:
    branches: [main]
    paths:
      - "Caddyfile"
      - "docker-compose.caddy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-caddy
  cancel-in-progress: false

env:
  APP_DIR: /opt/fixmymedtech-caddy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create app dir and write .env on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_DEPLOY_HOST }}
          username: ${{ secrets.PROD_DEPLOY_USER }}
          key: ${{ secrets.PROD_DEPLOY_KEY }}
          port: ${{ secrets.PROD_DEPLOY_PORT }}
          script: |
            mkdir -p ${{ env.APP_DIR }}
            cat > ${{ env.APP_DIR }}/.env <<'EOF'
            PROD_DOMAIN=${{ secrets.PROD_DOMAIN }}
            DEV_DOMAIN=${{ secrets.DEV_DOMAIN }}
            EOF

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_DEPLOY_HOST }}
          username: ${{ secrets.PROD_DEPLOY_USER }}
          key: ${{ secrets.PROD_DEPLOY_KEY }}
          port: ${{ secrets.PROD_DEPLOY_PORT }}
          source: "Caddyfile,docker-compose.caddy.yml"
          target: ${{ env.APP_DIR }}

      - name: Deploy Caddy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_DEPLOY_HOST }}
          username: ${{ secrets.PROD_DEPLOY_USER }}
          key: ${{ secrets.PROD_DEPLOY_KEY }}
          port: ${{ secrets.PROD_DEPLOY_PORT }}
          script: |
            cd ${{ env.APP_DIR }}
            docker compose -f docker-compose.caddy.yml up -d --remove-orphans
            docker image prune -f

name: Deploy Development

on:
  workflow_dispatch:
  # push:
  #   branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  APP_DIR: /opt/fixmymedtech-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create app dir and write .env on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEV_DEPLOY_HOST }}
          username: ${{ secrets.DEV_DEPLOY_USER }}
          key: ${{ secrets.DEV_DEPLOY_KEY }}
          port: ${{ secrets.DEV_DEPLOY_PORT }}
          script: |
            mkdir -p ${{ env.APP_DIR }}
            cat > ${{ env.APP_DIR }}/.env <<'EOF'
            SUPABASE_URL=${{ secrets.DEV_SUPABASE_URL }}
            SUPABASE_API_ANON_KEY=${{ secrets.DEV_SUPABASE_API_ANON_KEY }}
            SUPABASE_API_SECRET_KEY=${{ secrets.DEV_SUPABASE_API_SECRET_KEY }}
            SUPABASE_DB_SCHEMA=fixmymedtech
            FRONTEND_URL=${{ secrets.DEV_FRONTEND_URL }}
            API_URL=http://backend:8888
            EOF

      - name: Copy code to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_DEPLOY_HOST }}
          username: ${{ secrets.DEV_DEPLOY_USER }}
          key: ${{ secrets.DEV_DEPLOY_KEY }}
          port: ${{ secrets.DEV_DEPLOY_PORT }}
          source: "backend,frontend,db,docker-compose.dev.yml"
          target: ${{ env.APP_DIR }}

      - name: Build and deploy containers
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEV_DEPLOY_HOST }}
          username: ${{ secrets.DEV_DEPLOY_USER }}
          key: ${{ secrets.DEV_DEPLOY_KEY }}
          port: ${{ secrets.DEV_DEPLOY_PORT }}
          script: |
            cd ${{ env.APP_DIR }}
            docker compose -f docker-compose.dev.yml up -d --build --remove-orphans
            docker image prune -f

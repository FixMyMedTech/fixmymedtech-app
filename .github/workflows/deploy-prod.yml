name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  APP_DIR: /opt/fixmymedtech

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create app dir and write .env on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_DEPLOY_HOST }}
          username: ${{ secrets.PROD_DEPLOY_USER }}
          key: ${{ secrets.PROD_DEPLOY_KEY }}
          port: ${{ secrets.PROD_DEPLOY_PORT }}
          script: |
            mkdir -p ${{ env.APP_DIR }}
            cat > ${{ env.APP_DIR }}/.env <<'EOF'
            SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}
            SUPABASE_API_ANON_KEY=${{ secrets.PROD_SUPABASE_API_ANON_KEY }}
            SUPABASE_API_SECRET_KEY=${{ secrets.PROD_SUPABASE_API_SECRET_KEY }}
            SUPABASE_DB_URI=${{ secrets.PROD_SUPABASE_DB_URI }}
            SUPABASE_DB_SCHEMA=fixmymedtech
            FRONTEND_URL=${{ secrets.PROD_FRONTEND_URL }}
            API_URL=http://backend:8888
            EOF

      - name: Copy code to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_DEPLOY_HOST }}
          username: ${{ secrets.PROD_DEPLOY_USER }}
          key: ${{ secrets.PROD_DEPLOY_KEY }}
          port: ${{ secrets.PROD_DEPLOY_PORT }}
          source: "backend,frontend,docker-compose.yml"
          target: ${{ env.APP_DIR }}

      - name: Build and deploy containers
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_DEPLOY_HOST }}
          username: ${{ secrets.PROD_DEPLOY_USER }}
          key: ${{ secrets.PROD_DEPLOY_KEY }}
          port: ${{ secrets.PROD_DEPLOY_PORT }}
          script: |
            cd ${{ env.APP_DIR }}
            docker compose up -d --build --remove-orphans
            docker image prune -f

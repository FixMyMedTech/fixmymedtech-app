name: Publish the docs site

# Builds the MkDocs help centre (docs/) and publishes it to GitHub Pages
# (gh-pages branch) when the docs change on main. Run it by hand from the
# Actions tab to republish.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - name: Build (fails on broken links)
        working-directory: docs
        run: mkdocs build --strict
      - name: Publish to gh-pages
        working-directory: docs
        run: mkdocs gh-deploy --force

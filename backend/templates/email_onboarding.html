<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        .container {
            background-color: white;
            max-width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }
        .logo {
            width: 180px;
            margin-bottom: 20px;
        }
        h2 {
            color: #333;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .button {
            background-color: #104f84;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            display: inline-block;
            font-weight: bold;
        }
        .message {
            text-align: left;
            border-left: 3px solid #01a2b5;
            padding: 8px 12px;
            color: #333;
            font-style: italic;
            white-space: pre-line;
        }
        ul.benefits {
            text-align: left;
            color: #666;
            font-size: 15px;
            margin: 0 0 20px 20px;
        }
        ul.benefits li { margin-bottom: 6px; }
        .button:hover {
            background-color: #01a2b5;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="{{ logo_url }}" alt="FixMyMedTech" class="logo">
        <h2>{{ heading }}</h2>
        {% for p in paragraphs %}<p>{{ p }}</p>
        {% endfor %}
        {% if message %}<p class="message">{{ message }}</p>{% endif %}
        {% if benefits %}<ul class="benefits">{% for b in benefits %}<li>{{ b }}</li>{% endfor %}</ul>{% endif %}
        {% if link %}<p><a href="{{ link }}" class="button" style="color: #ffffff;">{{ button }}</a></p>{% endif %}
        {% if footer %}<p style="font-size: 13px;">{{ footer }}</p>{% endif %}
    </div>

</body>
</html>

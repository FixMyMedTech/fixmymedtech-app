---
- hosts: hetzner
  become: true
  vars:
    project_dir: /app/
    remote_env_file: "{{ project_dir }}/.env"
    compose_file: "{{ project_dir }}/docker-compose.yml"
    env_file: "{{ playbook_dir | dirname }}/.env"
  vars_files:
    - "{{playbook_dir}}/vars.yaml"
  tasks:
    - name: Download Docker installation script
      get_url:
        url: https://get.docker.com
        dest: /tmp/get-docker.sh
        mode: "0755"

    - name: Run Docker installation script
      shell: /tmp/get-docker.sh
      args:
        creates: /usr/bin/docker

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create project directory
      file:
        path: "{{ project_dir }}"
        state: directory
        mode: "0755"

    - name: Copy .env file to server
      copy:
        src: "{{ env_file }}"
        dest: "{{ remote_env_file }}"
      no_log: false

    - name: Copy Docker Compose file to server
      copy:
        src: "{{ playbook_dir | dirname }}/docker-compose.yml"
        dest: "{{ compose_file }}"

    - name: Copy Caddyfile to server
      copy:
        src: "{{ playbook_dir | dirname }}/Caddyfile"
        dest: "{{ project_dir }}/Caddyfile"

    - name: Copy app source to server
      copy:
        src: "{{ playbook_dir | dirname }}/{{ item }}"
        dest: "{{ project_dir }}"
      loop:
        - backend
        - frontend
        - db
        - docker-compose.caddy.yml

    - name: Login to Docker Hub (optional)
      shell: echo {{ dockerhub_token }} | docker login -u {{ dockerhub_username }} --password-stdin
      no_log: true
      when: dockerhub_token | length > 0

    - name: Build Docker images
      shell:
        cmd: docker compose -f docker-compose.yml build --pull
      args:
        chdir: "{{ project_dir }}"

    - name: Update Docker services
      shell:
        cmd: |
          services=$(docker compose -f docker-compose.yml config --services)
          for service in $services; do
            if docker compose -f docker-compose.yml ps --status running $service | grep -q $service; then
              echo "Updating running service: $service"
              docker compose -f docker-compose.yml up -d --build --no-deps "$service"
            else
              echo "Starting service: $service"
              docker compose -f docker-compose.yml up -d --build --no-deps "$service"
            fi
          done
      args:
        chdir: "{{ project_dir }}"

    - name: Remove orphaned containers
      shell:
        cmd: docker compose -f docker-compose.yml up -d --remove-orphans
      args:
        chdir: "{{ project_dir }}"

    - name: Deploy standalone Caddy service
      shell:
        cmd: docker compose -f docker-compose.caddy.yml up -d --remove-orphans
      args:
        chdir: "{{ project_dir }}"

    - name: Prune Docker system
      shell:
        cmd: docker system prune -f
      args:
        chdir: "{{ project_dir }}"

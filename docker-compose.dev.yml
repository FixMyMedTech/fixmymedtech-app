services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fixmymedtech
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8889:8888"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_API_SECRET_KEY: ${SUPABASE_API_SECRET_KEY}
      SUPABASE_API_ANON_KEY: ${SUPABASE_API_ANON_KEY}
      SUPABASE_DB_URI: postgresql+asyncpg://postgres:postgres@db:5432/fixmymedtech
      SUPABASE_DB_SCHEMA: fixmymedtech
      FRONTEND_URL: ${FRONTEND_URL:-https://dev.example.org}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:-http://backend:8888}
    ports:
      - "127.0.0.1:5002:5001"
    depends_on:
      - backend

volumes:
  pgdata:

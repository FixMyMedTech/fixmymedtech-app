services:

  backend:
    platform: linux/arm64
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8889:8888"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_SCHEMA: ${DB_SCHEMA:-fixmymedtech}
      FRONTEND_URL: ${FRONTEND_URL:-https://dev.example.org}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    platform: linux/arm64
    build: ./frontend
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:-http://backend:8888}
    ports:
      - "127.0.0.1:5002:5001"
    depends_on:
      - backend


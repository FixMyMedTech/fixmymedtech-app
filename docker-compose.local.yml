name: fixmymedtech-local

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # Host port is configurable in case 5432 is taken by another PostgreSQL.
      - "127.0.0.1:${LOCAL_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fixmymedtech
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infrastructure/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fixmymedtech"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    # No fixed platform: Docker builds for the machine it runs on (Apple
    # Silicon, Intel/AMD, Windows). Forcing arm64 made x86 machines emulate it.
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      # 8890 / 5003 by default so this stack runs next to the Supabase stack
      # (docker-compose.yml, 8888 / 5001). Override with LOCAL_*_PORT in .env.
      - "127.0.0.1:${LOCAL_BACKEND_PORT:-8890}:8888"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/fixmymedtech
      DB_SCHEMA: fixmymedtech
      # This stack is always on localhost, so its public address follows its
      # own port; FRONTEND_URL / API_BASE_URL in .env are for other stacks.
      FRONTEND_URL: http://localhost:${LOCAL_BACKEND_PORT:-8890}
      API_BASE_URL: http://localhost:${LOCAL_BACKEND_PORT:-8890}
      LOGO_URL: ${LOGO_URL:-}
      MAIL_SERVER: ${MAIL_SERVER}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_SSL_TLS: ${MAIL_SSL_TLS:-false}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-local-jwt-secret-change-me}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-dev-local-admin-session-secret}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
      SUPERUSER_NAME: ${SUPERUSER_NAME:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-fixmymedtech-local}
      AUTO_PROCESS_PHOTO: ${AUTO_PROCESS_PHOTO:-on}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_PHOTO_MODEL: ${GEMINI_PHOTO_MODEL:-gemini-2.5-flash-image}
      PHOTO_MAX_DIMENSION: ${PHOTO_MAX_DIMENSION:-1600}
      PHOTO_JPEG_QUALITY: ${PHOTO_JPEG_QUALITY:-85}
      HEALTHSITES_API_KEY: ${HEALTHSITES_API_KEY}
      DOCUMENT_MAX_MB: ${DOCUMENT_MAX_MB:-50}
      DISCORD_FEEDBACK_WEBHOOK_URL: ${DISCORD_FEEDBACK_WEBHOOK_URL:-}
      DISCORD_FEEDBACK_TAG_ID: ${DISCORD_FEEDBACK_TAG_ID:-}
      DISCORD_ISSUE_TAG_ID: ${DISCORD_ISSUE_TAG_ID:-}
      DISCORD_WELCOME_WEBHOOK_URL: ${DISCORD_WELCOME_WEBHOOK_URL:-}
      COMMUNITY_BOOKING_URL: ${COMMUNITY_BOOKING_URL:-}
      COMMUNITY_INTRO_VIDEO_URL: ${COMMUNITY_INTRO_VIDEO_URL:-}
      STAFF_INTRO_VIDEO_URL: ${STAFF_INTRO_VIDEO_URL:-}
      DISCORD_INVITE_URL: ${DISCORD_INVITE_URL:-}
      # Background-removal model (~176 MB), kept in a volume so it is
      # downloaded once instead of after every rebuild.
      U2NET_HOME: /models
      # Own cookie names, so logging in here doesn't log you out of another
      # stack on localhost (cookies are per host, not per port).
      ADMIN_SESSION_COOKIE: fmmt_local_admin
    volumes:
      - rembg-models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:-http://backend:8888}
      SESSION_SECRET: ${SESSION_SECRET:-dev-local-session-secret}
      SESSION_COOKIE: fmmt_local_session
    ports:
      - "127.0.0.1:${LOCAL_FRONTEND_PORT:-5003}:5001"
    depends_on:
      - backend

  minio:
    # MinIO no longer publishes images (removed from Docker Hub; quay.io needs
    # a login). pgsty/minio is MinIO rebuilt from its open-source code by the
    # Pigsty project: same binary, settings and data format. Pinned on purpose.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOCAL_MINIO_PORT:-9002}:9000"
      - "127.0.0.1:${LOCAL_MINIO_CONSOLE_PORT:-9003}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pg-data:
  minio-data:
  rembg-models:
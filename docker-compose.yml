services:

  backend:
    platform: linux/arm64
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_API_SECRET_KEY: ${SUPABASE_API_SECRET_KEY}
      SUPABASE_API_ANON_KEY: ${SUPABASE_API_ANON_KEY}
      SUPABASE_DB_URI: ${SUPABASE_DB_URI}
      SUPABASE_DB_SCHEMA: fixmymedtech
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    platform: linux/arm64
    build: ./frontend
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:-http://backend:8888}
    ports:
      - "127.0.0.1:5001:5001"
    depends_on:
      - backend

